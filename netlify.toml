[build]
  functions = "netlify/functions"
  publish = "static"

[functions]
  included_files = [
    "templates/**",
    "data/**",
    "admin_config.json",
    "static/**",
    "knowledge_engine.py",
    "app.py"
  ]

[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
